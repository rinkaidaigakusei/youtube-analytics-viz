name: Collect first-24h view snapshots

# 公開後24時間以内の動画の再生数を20分おきに記録し、dataブランチの snapshots.json に追記する。
# 追跡対象の動画が無いときは何もコミットしない。
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-snapshots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            git worktree add -B data data-out FETCH_HEAD
          else
            git worktree add --orphan -b data data-out
          fi

      - name: Record snapshots
        run: python3 collector/collect_snapshots.py data-out/snapshots.json
        env:
          # Settings > Secrets and variables > Actions > Secrets に登録する(YouTube Data API v3 のAPIキー)
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: UCQxU7WIqxaL7D65QKP9tuBA

      - name: Commit and push
        working-directory: data-out
        run: |
          git add snapshots.json
          if git diff --cached --quiet; then
            echo "No new snapshots."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Record view snapshots"
          git push origin data
